services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: creative-prototype-assistant:1.0.0
    container_name: creative-prototype-assistant
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      # 覆盖 .env.docker 中的相对路径，确保 SQLite 落在持久卷
      DATABASE_URL: file:/app/data/prod.db
      TZ: Asia/Shanghai
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  app-data:
    name: creative-prototype-assistant-data
